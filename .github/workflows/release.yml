name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: npm test

      - name: Check manifest version matches tag
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "manifest $v != tag $GITHUB_REF_NAME"; exit 1; }

      - name: Package extension
        run: zip -r "mono-new-tab-$GITHUB_REF_NAME.zip" manifest.json newtab.html *.js style.css icons lib

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mono-new-tab-*.zip --title "Mono New Tab $GITHUB_REF_NAME" --generate-notes
