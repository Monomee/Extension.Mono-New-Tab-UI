<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab mới</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wall"></div>
<div id="dim"></div>

<header id="top">
  <form id="search" class="glass" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input name="q" placeholder="Tìm kiếm trên web" autocomplete="off" aria-label="Tìm kiếm">
  </form>
  <div class="tools">
    <button id="addBtn" class="tool glass edit-only" title="Thêm" aria-label="Thêm">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="editBtn" class="tool glass" title="Chỉnh sửa màn hình" aria-label="Chỉnh sửa">
      <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>
    </button>
    <button id="doneBtn" class="tool glass done edit-only">Xong</button>
    <button id="setBtn" class="tool glass" title="Cài đặt" aria-label="Cài đặt">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="pages"></main>
<nav id="dots" aria-label="Trang"></nav>

<footer id="dock" class="glass">
  <div id="dockList"></div>
  <span class="sep"></span>
  <button id="dockAdd" class="dock-add" title="Thêm vào dock" aria-label="Thêm vào dock">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</footer>

<dialog id="linkDlg" class="glass sheet">
  <form id="linkForm">
    <h2 id="linkTitle">Thêm lối tắt</h2>
    <label>Địa chỉ<input name="url" placeholder="vd: youtube.com" required></label>
    <label>Tên<input name="title" placeholder="Tự lấy theo tên miền" maxlength="60"></label>
    <label id="placeRow">Đặt ở
      <select name="place"><option value="page">Trang hiện tại</option><option value="dock">Dock</option></select>
    </label>
    <p class="err" id="linkErr"></p>
    <div class="row">
      <button type="button" class="btn" data-close>Hủy</button>
      <button class="btn primary">Lưu</button>
    </div>
  </form>
</dialog>

<dialog id="addDlg" class="glass sheet">
  <h2>Thêm vào màn hình</h2>
  <div class="add-grid">
    <button class="btn" data-add="link">Lối tắt</button>
    <button class="btn" data-add="clock">Đồng hồ</button>
    <button class="btn" data-add="date">Ngày</button>
    <button class="btn" data-add="todo">Việc cần làm</button>
    <button class="btn" data-add="note-4">Ghi chú (lớn)</button>
    <button class="btn" data-add="note-2">Ghi chú (nhỏ)</button>
  </div>
  <div class="row"><button class="btn" data-close>Đóng</button></div>
</dialog>

<dialog id="folderDlg" class="folder-dlg">
  <div class="folder-panel">
    <input id="folderTitle" class="folder-title" maxlength="40" aria-label="Tên thư mục">
    <div id="folderGrid" class="folder-grid"></div>
  </div>
</dialog>

<aside id="settings" class="glass" aria-label="Cài đặt" inert>
  <div class="set-head"><h2>Cài đặt</h2><button class="btn" id="setClose">Đóng</button></div>

  <section>
    <h3>Ảnh nền</h3>
    <div class="row wrap">
      <label class="btn">Chọn ảnh từ máy<input type="file" id="wallFile" accept="image/*" hidden></label>
      <button class="btn" id="wallReset">Mặc định</button>
    </div>
    <form class="row" id="wallUrlForm">
      <input name="url" placeholder="Hoặc dán link ảnh (https://…)">
      <button class="btn">Dùng</button>
    </form>
    <label>Làm tối nền <input type="range" id="dimRange" min="0" max="0.8" step="0.05"></label>
    <label>Làm mờ nền <input type="range" id="blurRange" min="0" max="30" step="1"></label>
  </section>

  <section>
    <h3>Tìm kiếm</h3>
    <label class="check"><input type="checkbox" id="searchOn"> Hiện thanh tìm kiếm</label>
    <label>Công cụ
      <select id="engineSel">
        <option value="google">Google</option><option value="bing">Bing</option><option value="duckduckgo">DuckDuckGo</option>
      </select>
    </label>
  </section>

  <section>
    <h3>Sao lưu</h3>
    <div class="row wrap">
      <button class="btn" id="exportBtn">Xuất file JSON</button>
      <label class="btn">Nhập file JSON<input type="file" id="importFile" accept=".json,application/json" hidden></label>
    </div>
    <p class="hint">Ảnh nền tải từ máy không nằm trong file sao lưu.</p>
  </section>

  <p class="msg" id="setMsg" role="status"></p>
</aside>

<script src="lib/Sortable.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
