<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Mono</title>
<link rel="stylesheet" href="style.css">
</head>
<!-- Toolbar popup / Ctrl+Shift+Space from any tab: spotlight on top, open tabs as cards below. -->
<body class="popup">
<form id="search" class="glass" role="search">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  <input name="q" placeholder="Tìm tab, lối tắt, trang web…" autocomplete="off" autofocus aria-label="Tìm kiếm" data-i18n-ph="pop.ph" data-i18n-aria="search.aria"
    role="combobox" aria-controls="results" aria-autocomplete="list">
  <button type="button" id="panelBtn" class="pop-btn" title="Mở side panel" aria-label="Mở side panel" data-i18n-title="pop.panel" data-i18n-aria="pop.panel" hidden>
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
  </button>
</form>
<ul id="results" class="glass" role="listbox" hidden></ul>
<main class="pop-tabs">
  <h3 data-i18n="sw.aria">Tab đang mở</h3>
  <div id="cards" class="cards"></div>
  <section class="sw-closed" hidden>
    <h3 data-i18n="sw.closed">Mới đóng gần đây</h3>
    <div id="closedList"></div>
  </section>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
